apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: safechat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: safechat-ml-service:latest
          env:
            - name: SAFECHAT_MONGODB_URL
              value: "mongodb://mongodb:27017"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: safechat-secrets
                  key: gemini-api-key
                  optional: true
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: safechat
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: ml-service

