apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: safechat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: safechat-api-gateway:latest
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://safety_user:safety_password@postgres:5432/safety_platform"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MONGODB_URL
              value: "mongodb://mongodb:27017"
            - name: ML_SERVICE_URL
              value: "http://ml-service:8000"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: safechat-secrets
                  key: jwt-secret-key
                  optional: true
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: safechat
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: api-gateway

